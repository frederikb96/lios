[project]
name = "lios-protocol"
version = "0.1.7"
description = "Shared crypto, framing, pairing and wire types for LIOS clients and relay"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Frederik Berg" }]
dependencies = [
    "cryptography>=43.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/frederikb96/lios"
Repository = "https://github.com/frederikb96/lios"
Issues = "https://github.com/frederikb96/lios/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lios_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
