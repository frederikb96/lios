[project]
name = "lios-linux"
version = "0.1.0"
description = "LIOS Linux client -- resident GTK4/libadwaita app, clipboard bridge to the relay"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frederik Berg" }]
dependencies = [
    "lios-protocol",
    "PyGObject>=3.48.0",
    "pycairo>=1.26.0",
    "qrcode>=8.0",
]

[project.urls]
Homepage = "https://github.com/frederikb96/lios"
Repository = "https://github.com/frederikb96/lios"
Issues = "https://github.com/frederikb96/lios/issues"

[project.scripts]
lios = "lios_linux.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "PyGObject-stubs>=2.11.0",
]

[tool.uv.sources]
lios-protocol = { path = "../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lios_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["gi.*", "qrcode.*"]
ignore_missing_imports = true
