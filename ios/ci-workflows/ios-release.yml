# Not a live workflow — see ios/ci-workflows/README.md for why this lives here instead of
# .github/workflows/. Adapted from pai-ios's release.yml for LIOS's three targets (one
# certificate, three provisioning profiles).
name: iOS Release

on:
  push:
    tags: ['ios-v*.*.*']
  # TestFlight builds expire after 90 days — this keeps LIOS from silently stopping launching.
  schedule:
    - cron: '23 4 1 */2 *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0). Ignored for tag pushes.'
        required: true
        default: '0.0.1'
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ios

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "marketing=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No test step here — the package runs on every push to ios/** in ios-free-checks, on
      # Linux, in a couple of minutes. `fastlane build` below still archives Release and would
      # catch a release-config-only compile error.
      - name: Build and sign
        run: bundle exec fastlane build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFY_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # 🚨 UPLOADING IS NOT DISTRIBUTING — see the `distribute` job below and the ios skill's
      # signing reference for why an uploaded, VALID build can still be installable by nobody.
      - name: Upload to TestFlight
        if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
        run: bundle exec fastlane upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFY_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ios/build/*.dSYM.zip

  # Uploading is not distributing — see Tooling/distribute-build.py's own header. Its own runner,
  # plain Ubuntu: attaching a build is authenticated HTTPS and needs no Apple hardware.
  distribute:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - run: pip install --quiet 'pyjwt[crypto]'

      - name: Attach the build to the beta group
        run: python3 ios/Tooling/distribute-build.py "${{ github.run_number }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
