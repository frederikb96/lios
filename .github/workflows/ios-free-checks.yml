# Everything about the iOS half that can be checked without Apple hardware.
# Called from ci.yaml on pull requests that touch the iOS lane, so a relay-only change does not
# spend a run here and the result feeds the `CI ok` gate.
name: iOS free checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The official image carries the toolchain and its system dependencies.
    container: swift:6.4.2-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ios/LIOSKit/.build
          key: spm-container-${{ hashFiles('ios/LIOSKit/Package.swift') }}
          restore-keys: spm-container-

      - name: Build and test the package
        run: |
          set -o pipefail
          swift build --package-path ios/LIOSKit --build-tests 2>&1 | tee /tmp/build.log
          swift test --package-path ios/LIOSKit --skip-build

      # The only check that reaches the app target, the share extension and the notification
      # service extension — none of which Linux compiles at all.
      - name: Syntax-check what Linux cannot compile
        run: ./ios/Tooling/parse-swift.sh

      - name: Scan for Swift 6 shapes only a Mac would reject
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-minimal
          ./ios/Tooling/swift6-lint.py

      - name: Format
        run: |
          swift format lint --recursive --strict --configuration ios/.swift-format \
            ios/LIOS ios/LIOSShare ios/LIOSNotify ios/LIOSKit/Sources ios/LIOSKit/Tests

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      - name: Publish the formatting correction as a patch
        if: failure()
        run: |
          swift format --in-place --recursive --configuration ios/.swift-format \
            ios/LIOS ios/LIOSShare ios/LIOSNotify ios/LIOSKit/Sources ios/LIOSKit/Tests
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff > format.patch

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-format-patch
          path: format.patch
          retention-days: 5
