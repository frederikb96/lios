name: Release

on:
  push:
    tags:
      - "v*"

# Deliberately no cancel-in-progress: publishing an image, a chart and a GitHub release is
# not idempotent, and cancelling midway leaves a partial release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/frederikb96/lios-relay
  CHART_REGISTRY: oci://ghcr.io/frederikb96/charts

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tag, pyproject and chart must agree
        run: python scripts/check_release_versions.py "${GITHUB_REF_NAME}"

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          python scripts/extract_changelog.py "${{ steps.version.outputs.version }}" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  image:
    name: Build and push image
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push Helm chart
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint and template before publishing
        run: |
          helm lint charts/lios
          helm template lios charts/lios > /dev/null

      - name: Package and push
        run: |
          helm package charts/lios --destination dist
          helm push "dist/lios-${{ needs.guard.outputs.version }}.tgz" "${{ env.CHART_REGISTRY }}"

  # flatpak-builder runs every build step inside a bubblewrap sandbox, and bubblewrap needs an
  # unprivileged user namespace to create one. A hosted runner is a full VM and provides that,
  # so the toolchain installs and runs directly with nothing nested underneath it. The runtime
  # version is read out of the manifest rather than repeated here.
  flatpak:
    name: Build Flatpak bundle
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Flatpak toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder

      - name: Build the bundle
        working-directory: linux
        run: |
          set -euo pipefail
          runtime=$(grep -oP "^runtime-version:\s*'\K[^']+" \
            packaging/io.github.frederikb96.Lios.yml)
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            "org.gnome.Platform//$runtime" "org.gnome.Sdk//$runtime"
          flatpak-builder --repo=repo --force-clean \
            build packaging/io.github.frederikb96.Lios.yml
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo lios.flatpak io.github.frederikb96.Lios

      - uses: actions/upload-artifact@v4
        with:
          name: lios-flatpak
          path: linux/lios.flatpak
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [guard, image, chart, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: lios-flatpak
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/lios.flatpak
