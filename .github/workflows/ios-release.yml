# Builds, signs and uploads a TestFlight build, then attaches it to the beta group.
# Triggered by an ios-v*.*.* tag; the monorepo prefix keeps it clear of the relay's own tags.
name: iOS Release

on:
  push:
    tags: ['ios-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0). Ignored for tag pushes.'
        required: true
        default: '0.0.1'
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false
      # TestFlight builds stop launching 90 days after upload. Setting this rebuilds an existing
      # release under a new build number — same code, same marketing version — and uploads it,
      # which is how an installed app is kept from expiring between releases.
      refresh_tag:
        description: 'Release tag to rebuild for TestFlight (e.g. ios-v1.2.3). Overrides version, implies upload.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios

    steps:
      # Empty unless refreshing, which checks out the triggering ref as usual.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.refresh_tag }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ios

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REFRESH_TAG: ${{ github.event.inputs.refresh_tag }}
        run: |
          if [ -n "${REFRESH_TAG}" ]; then
            echo "marketing=${REFRESH_TAG#ios-v}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "marketing=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No test step here — the package runs on every push to ios/** in ios-free-checks, on
      # Linux, in a couple of minutes. `fastlane build` below still archives Release and would
      # catch a release-config-only compile error.
      - name: Build and sign
        run: bundle exec fastlane build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFY_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # 🚨 UPLOADING IS NOT DISTRIBUTING — see the `distribute` job below and the ios skill's
      # signing reference for why an uploaded, VALID build can still be installable by nobody.
      - name: Upload to TestFlight
        if: github.ref_type == 'tag' || github.event.inputs.upload == 'true' || github.event.inputs.refresh_tag != ''
        run: bundle exec fastlane upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NOTIFY_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFY_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ios/build/*.dSYM.zip

  # Uploading is not distributing — see Tooling/distribute-build.py's own header. Its own runner,
  # plain Ubuntu: attaching a build is authenticated HTTPS and needs no Apple hardware.
  distribute:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.upload == 'true' || github.event.inputs.refresh_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - run: pip install --quiet 'pyjwt[crypto]'

      - name: Attach the build to the beta group
        run: python3 ios/Tooling/distribute-build.py "${{ github.run_number }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
