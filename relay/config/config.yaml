# LIOS Relay Configuration
#
# This file contains ALL infrastructure defaults, with comments. It is baked into the image
# at build time and is always present. Override sparingly with config-custom/config.override.yaml
# (sparse, only the values that differ) or LIOS_<SECTION>_<KEY> environment variables.
#
# The relay never has an in-code fallback for anything -- it fails fast at startup if a
# required value (database.url) is still empty after every override is applied.

server:
  host: 0.0.0.0
  port: 8080
  log_level: INFO
  cors_origins: []            # same-origin serving by default; empty disables CORS
  # Serve FastAPI's interactive docs and the OpenAPI schema (/docs, /redoc, /openapi.json).
  # Off, those routes answer 404: the relay is reachable from the internet and the schema
  # describes every route to anyone who asks.
  expose_api_docs: false

database:
  url: "${LIOS_DATABASE_URL}"
  pool_size: 10
  max_overflow: 5

# Ceiling on one item's sealed blob, enforced while the upload is being read so an oversized
# item cannot exhaust memory before it is rejected.
items:
  max_size_bytes: 26214400    # 25 MiB

# The relay never becomes an archive: a background task prunes on this policy, matching the
# retention each client keeps in its own local history.
retention:
  max_items: 50                # newest N items kept; anything older is pruned regardless of ack
  max_age_days: 7
  prune_interval_seconds: 300

pairing:
  # How long a pairing code minted by POST /api/devices/pairing-sessions stays redeemable.
  code_ttl_seconds: 600
  # POST /api/devices/bootstrap registers the first device without a token, so whoever calls it
  # on an empty relay owns the fleet. Off, it answers 403; turn it on only while pairing the
  # first device of a fresh relay.
  bootstrap_enabled: false
  # POST /api/devices/pair answers 429 once this many codes were refused within the last
  # lockout_seconds, counted over every caller. A code is short, so this keeps guessing slow.
  max_failed_redeems: 10
  lockout_seconds: 300

# Push for iOS devices, sent through the shared push relay (a separate service that holds the
# Apple credential). The relay never learns an item's content: it forwards a small blob to
# Apple, and the iOS app opens it. Leave relay_url empty to send no push at all; every other
# endpoint works the same. The iOS app registers with the relay URL compiled into it, so a
# server pointed anywhere else only pushes to devices registered there.
push:
  relay_url: https://push.frederikberg.net
  send_timeout_seconds: 10
  # How long Apple holds a push for an offline phone. 0 = deliver now or never; the phone
  # catches up on missed items when it next connects anyway.
  ttl_seconds: 0
