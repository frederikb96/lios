[project]
name = "lios-relay"
version = "0.1.0"
description = "LIOS relay -- stores ciphertext, tracks acks, rings doorbells. Cannot read a byte it forwards."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Frederik Berg" }]
dependencies = [
    "lios-protocol",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "aioapns>=3.0",
]

[project.urls]
Homepage = "https://github.com/frederikb96/lios"
Repository = "https://github.com/frederikb96/lios"
Issues = "https://github.com/frederikb96/lios/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "websockets>=13.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.uv.sources]
lios-protocol = { path = "../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lios_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
markers = [
    "unit: Unit tests (no external services)",
    "pg: Integration tests against Postgres via testcontainers",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["aioapns.*"]
ignore_missing_imports = true
